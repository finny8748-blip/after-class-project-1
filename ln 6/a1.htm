<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Book Donation Form</title>
  </head>
  <body>
  <h1>Book Donation Form</h1>

<form>

  <fieldset>
    <legend>Donor Details</legend>
    
    <div>
      <label for="donor-name">Your Name:</label>
      <input type="text" id="donor-name" name="donor_name" required>
    </div>
    <br>
    <div>
      <label for="donor-id">Donor ID:</label>
      <input type="password" id="donor-id" name="donor_id" required>
    </div>
    <br>
    <div>
      <label for="donation-date">Donation Date:</label>
      <input type="date" id="donation-date" name="donation_date" required>
    </div>
  </fieldset>

  <fieldset>
    <legend>Book Details</legend>
    
    <div>
      <label for="book-category">Book Category:</label>
      <select id="book-category" name="book_category">
        <option value="fiction">Fiction</option>
        <option value="science">Science</option>
        <option value="history">History</option>
        <option value="education">Education</option>
      </select>
    </div>
    <br>
    <div>
      <label>Book Condition:</label><br>
      <input type="radio" id="condition-like-new" name="book_condition" value="Like New">
      <label for="condition-like-new">Like New</label><br>
      
      <input type="radio" id="condition-good" name="book_condition" value="Good">
      <label for="condition-good">Good</label><br>
      
      <input type="radio" id="condition-used" name="book_condition" value="Used">
      <label for="condition-used">Used</label>
    </div>
    <br>
    <div>
      <label for="book-notes">Book Title or Notes:</label><br>
      <textarea id="book-notes" name="book_notes" rows="4" cols="40" placeholder="Enter book title or any additional notes..."></textarea>
    </div>
  </fieldset>

  <fieldset>
    <legend>Drop-Off Day</legend>
    
    <label>Select Drop-Off Days:</label><br>
    <input type="checkbox" id="day-monday" name="drop_off_days" value="Monday">
    <label for="day-monday">Monday</label><br>
    
    <input type="checkbox" id="day-wednesday" name="drop_off_days" value="Wednesday">
    <label for="day-wednesday">Wednesday</label><br>
    
    <input type="checkbox" id="day-friday" name="drop_off_days" value="Friday">
    <label for="day-friday">Friday</label>
  </fieldset>

  <br>
  <button type="submit">Donate My Book</button>

</form>  
  </body>
</html>
